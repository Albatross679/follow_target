[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choi2025-follow-target"
version = "0.1.0"
description = "Self-contained SAC training for soft manipulator follow-target (Choi & Tong, 2025)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchrl>=0.3",
    "tensordict>=0.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.60",
    "wandb>=0.15",
]

[project.optional-dependencies]
dev = ["pytest", "psutil"]

[project.scripts]
choi2025-train = "choi2025_follow_target.train:main"
choi2025-record = "choi2025_follow_target.record:main"

[tool.setuptools.packages.find]
include = ["choi2025_follow_target*"]
